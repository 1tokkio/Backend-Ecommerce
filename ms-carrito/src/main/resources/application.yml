server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ms-carrito

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: carrito
    open-in-view: false

app:
  security:
    jwt:
      providers:
        - name: azure
          jwk-set-uri: ${AZURE_JWKS_URI}
          issuers:
            - ${AZURE_ISSUER_URI}
          audiences:
            - ${AZURE_CLIENT_ID}
            - api://${AZURE_CLIENT_ID}
        - name: cognito
          jwk-set-uri: ${COGNITO_JWKS_URI}
          issuers:
            - ${COGNITO_ISSUER_URI}
          audiences:
            - ${COGNITO_CLIENT_ID}
          default-role: Cliente

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
