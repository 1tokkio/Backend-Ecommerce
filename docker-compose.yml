services:
  ms-usuarios:
    build: ./ms-usuarios
    container_name: pedidos360-ms-usuarios
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_JWKS_URI: ${AZURE_JWKS_URI}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      COGNITO_JWKS_URI: ${COGNITO_JWKS_URI}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - pedidos360-network
    restart: unless-stopped

  ms-productos:
    build: ./ms-productos
    container_name: pedidos360-ms-productos
