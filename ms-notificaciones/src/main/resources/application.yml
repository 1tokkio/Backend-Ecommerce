server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ms-notificaciones

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: notificaciones
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false

  mail:
    # Sin valor por defecto, el servicio no arranca cuando faltan estas variables
    # en local. Con default vacio arranca igual; CorreoService detecta que no hay
    # usuario configurado y deja el correo en el log en vez de enviarlo.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

correo:
  remitente: ${SMTP_USER:}

app:
  security:
    jwt:
      providers:
        - name: azure
          jwk-set-uri: ${AZURE_JWKS_URI}
          issuers:
            - ${AZURE_ISSUER_URI}
          audiences:
            - ${AZURE_CLIENT_ID}
            - api://${AZURE_CLIENT_ID}
        - name: cognito
          jwk-set-uri: ${COGNITO_JWKS_URI}
          issuers:
            - ${COGNITO_ISSUER_URI}
          audiences:
            - ${COGNITO_CLIENT_ID}
          default-role: Cliente

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
