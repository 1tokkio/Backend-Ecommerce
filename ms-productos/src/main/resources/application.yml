server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-productos

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: productos
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # Sin esto, un mensaje que falla vuelve a la cola y se reintenta para siempre.
        default-requeue-rejected: false

app:
  security:
    jwt:
      providers:
        - name: azure
          jwk-set-uri: ${AZURE_JWKS_URI}
          issuers:
            - ${AZURE_ISSUER_URI}
          audiences:
            - ${AZURE_CLIENT_ID}
            - api://${AZURE_CLIENT_ID}
        - name: cognito
          jwk-set-uri: ${COGNITO_JWKS_URI}
          issuers:
            - ${COGNITO_ISSUER_URI}
          audiences:
            - ${COGNITO_CLIENT_ID}
          default-role: Cliente

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
